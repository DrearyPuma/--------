<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟搜索引擎首页</title>
</head>
<body>
    <!-- 表单，提交跳转到百度搜索，用GET方式 -->

        <input type="text" name="wd" placeholder="请输入搜索内容">
        <button type="submit">用百度搜索</button>
    </form>
</body>
</html>
