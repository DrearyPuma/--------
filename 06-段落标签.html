    <p>111一般指高等学校学科创新引智计划。 “高等学校学科创新引智计划”（简称“111计划”）是中华人民共和国教育部、国家外国专家局于2006年起联合实施的专项计划，旨在通过引进海外顶尖人才提升中国高校学科竞争力，推进世界一流大学和一流学科建设。</p>
