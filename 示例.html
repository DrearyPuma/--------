<!DOCTYPE html>
<!-- ↑ 【第1行】文档类型声明（Doctype）：告诉浏览器"请用 HTML5 标准模式解析本文件"。
     它不是标签、没有结束标签，但必须是文件里的第一条内容——前面不能有空行或注释，
     否则浏览器可能进入"怪异模式"（quirks mode），盒模型、行高等计算会和标准模式不一致。 -->

<!-- ═══════════════════════════════════════════════════════════════════
     文件总览：一个"网易新闻卡片"页面
     · 结构 —— HTML 骨架：head（元信息 + 样式）+ body（一张卡片）
     · 样式 —— head 里内嵌 style 中的 CSS：负责布局、配色、装饰
     · 交互 —— 没有任何 JavaScript，唯一的效果是鼠标悬停时链接变色（纯 CSS）
     · 说明 —— 代码与原文件完全一致，仅新增了注释；
                注释中的【第 N 行】指原文件的行号，方便对照阅读
     ═══════════════════════════════════════════════════════════════════ -->

<html lang="zh-CN">
<!-- ↑ 【第2行】根元素 html，整份文档只有一个。
     lang="zh-CN" 声明语言为简体中文，影响：① 屏幕阅读器的发音；
     ② 浏览器是否提示"翻译此页"；③ 某些汉字的中/日字形选择（如"直""骨"）。 -->

<head>
<!-- ↑ 【第3行】头部开始。head 里放"给浏览器看"的元信息：编码、视口、标题、样式。
     这些内容不会直接画在页面上（title 也只显示在标签栏）。 -->

    <meta charset="UTF-8">
    <!-- ↑ 【第4行】字符编码声明：告诉浏览器"本文件用 UTF-8 解码"，否则中文变乱码。
         规范要求它出现在文件前 1024 字节以内，所以放在 head 最前面。单标签，无结束标签。 -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ↑ 【第5行】移动端视口设置：
         width=device-width → 布局宽度 = 设备的 CSS 像素宽度；
         initial-scale=1.0  → 初始缩放 1 倍（既不放大也不缩小）。
         少了这行，手机浏览器会按 980px 虚拟宽度渲染再整体缩小，字会小到看不清。 -->

    <title>网易新闻卡片</title>
    <!-- ↑ 【第6行】文档标题：显示在浏览器标签页、任务栏、收藏夹，
         也是搜索引擎结果里的大标题。 -->

    <style>
        /* ══════════════════════════════════════════════════════════════
           【第7行】样式表开始。从这里到样式表结束标签之间，全部是 CSS 代码。
           提醒：CSS 的注释只有"斜杠 + 星号"这一种形式，不能嵌套；
           在 style 元素内部也不应写 HTML 那种注释符号（属于不规范写法）。
           ══════════════════════════════════════════════════════════════ */

        body {
            /* 【第8行】选择器 body：作用于整个页面主体。
               这一段的核心目的 —— 让卡片在屏幕正中央。 */
            display: flex;             /* 【9】把 body 变成弹性容器（flex container），下面两行居中才有意义 */
            justify-content: center;   /* 【10】主轴（默认水平）居中 → 卡片左右居中 */
            align-items: center;       /* 【11】交叉轴（垂直）居中 → 卡片上下居中 */
            min-height: 100vh;         /* 【12】最小高度 = 1 个视口高度（vh = 视口高度的 1%）。用 min-height 而非 height：内容变高时页面跟着长，不会被裁掉 */
            margin: 0;                 /* 【13】清掉浏览器给 body 的默认 8px 外边距，否则页面四周留白、还会冒出滚动条 */
            background-color: #f5f5f5; /* 【14】页面浅灰底色，让白色卡片"浮"起来形成层次 */
        }                              /* 【15】body 规则结束 */

        .card {
            /* 【第17行】类选择器：匹配 class="card" 的元素（本页唯一的卡片容器）。
               这一段定义"卡片长什么样"：宽度、边框、内边距、圆角、阴影、背景。 */
            width: 300px;               /* 【18】内容区宽度 300px —— 注意：不含 padding 和 border */
            border: 1px solid #ccc;     /* 【19】边框：1px 粗细 / solid 实线 / #ccc 浅灰 */
            padding: 10px;              /* 【20】内边距：内容与边框之间留 10px 空隙 */
            border-radius: 8px;         /* 【21】8px 圆角，四个角变圆润 */
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.15); /* 【22】外阴影：水平偏移 0 / 垂直偏移 0 / 模糊 5px / 扩散 0，颜色为 15% 透明黑 → 四周柔和的浮起感 */
            background-color: #fff;     /* 【23】卡片白底，与页面 #f5f5f5 灰底拉开层次 */

            /* 提示【对应第24行处】：本段没有写 box-sizing: border-box，
               所以卡片实际占宽 = 300 + 10×2 + 1×2 = 322px。
               若想"宽就是 300px"，需补一行 box-sizing: border-box;（此处仅提示，未改代码）。 */
        }

        .card img {
            /* 【第26行】选中卡片内的图片。目标：铺满卡片内容区宽度，且不被拉伸变形。 */
            width: 300px;               /* 【27】图片宽 300px，正好等于卡片内容区宽度，横向铺满 */
            height: auto;               /* 【28】高度按原图比例自动计算 → 图片不变形 */
            display: block;             /* 【29】改成块级元素。图片默认是行内元素，会按文字基线对齐、在底部留几像素空隙，这行消除它 */
            margin-bottom: 10px;        /* 【30】图片与下方标题之间留 10px */
        }                               /* 【31】图片规则结束 */

        .card h3 {
            /* 【第33行】选中卡片内的三级标题：18px 粗体 + 左侧红色竖条（竖条见下一段）。
               两处关键：position: relative 给伪元素当定位基准；padding-left 给竖条腾位置。 */
            font-size: 18px;            /* 【34】字号 18px，比正文 14px 大一档，建立标题层级 */
            font-weight: bold;          /* 【35】加粗。h3 默认本来就是粗体，这行属于显式声明的冗余写法，无害 */
            color: #333;                /* 【36】深灰近黑，比纯黑 #000 看着更柔和 */
            margin-bottom: 8px;         /* 【37】标题下方留 8px */
            position: relative;         /* 【38】关键：给标题建立"定位参照系"。下一段的 ::before 用 absolute 时，会以这个 h3 为基准，而不是整个页面 */
            padding-left: 10px;         /* 【39】左侧内边距 10px：给红色竖条腾位置，文字不会压在竖条上 */
        }                               /* 【40】标题规则结束 */

        .card h3::before {
            /* 【第42行】伪元素 ::before：在标题文字"前面"生成一个虚拟子元素，
               它不写进 HTML，纯装饰。这一段就是"标题前红色竖条"效果本身。
               定位三件套：absolute + left:0 + top:50% + translateY(-50%)。 */
            content: "";                /* 【43】伪元素必须写 content 才会渲染；空字符串 = 不要文字内容，只要那个方盒 */
            position: absolute;         /* 【44】绝对定位：相对最近的已定位祖先（就是上面的 h3）定位，脱离文档流 */
            left: 0;                    /* 【45】贴在标题盒子的最左边 */
            top: 50%;                   /* 【46】顶边放到父容器高度的 50% 处 */
            transform: translateY(-50%);/* 【47】再向上移动自身高度的一半 → 与第 46 行配合实现真正的垂直居中（只写 top:50% 会偏低） */
            width: 3px;                 /* 【48】竖条宽 3px */
            height: 18px;               /* 【49】竖条高 18px，与标题字号一致，视觉上"顶满"标题 */
            background-color: #de2626;  /* 【50】网易标志性的正红色 */
        }                               /* 【51】竖条规则结束 */

        .card p {
            /* 【第53行】选中卡片内的段落，也就是新闻摘要那段正文。
               中文排版三要素都在这：字号、行高、首行缩进。 */
            font-size: 14px;            /* 【54】正文字号 14px，比标题小一档 */
            color: #666;                /* 【55】中灰色，视觉权重低于标题，符合"次级信息"的层级 */
            line-height: 1.6;           /* 【56】行高 = 字号的 1.6 倍（14 × 1.6 ≈ 22.4px）。无单位的好处：随字号自动缩放 */
            text-indent: 2em;           /* 【57】首行缩进 2 个字符（em 相对当前字号），符合中文排版习惯 */
            margin-bottom: 10px;        /* 【58】段落后留 10px */
        }                               /* 【59】段落规则结束 */

        /* 用结构伪类选择器给第一个段落加底部细线 */
        .card p:first-of-type {
            /* 【第62行】结构伪类 :first-of-type：在同一级"同类型"元素里排第一的那个 p。
               注意它按"第几个 p"计算，不按"第几个子元素"计算，
               所以图片、标题排在它前面也不影响命中。当前页只有一个 p，因此必然命中。 */
            border-bottom: 2px solid #ffd700; /* 【63】2px 金黄色实线下边框，充当分隔线 */
            padding-bottom: 4px;        /* 【64】底部内边距 4px，让线条与文字之间留一点呼吸空间 */
        }                               /* 【65】首段规则结束 */

        .card a {
            /* 【第67行】选中卡片内的超链接（"阅读全文"）。 */
            font-size: 13px;            /* 【68】13px，比正文再小一档，作为辅助操作文字 */
            color: #de2626;             /* 【69】与标题竖条同色，形成品牌色呼应 */
            text-decoration: none;      /* 【70】去掉链接默认的下划线 */
            display: block;             /* 【71】改成块级元素，独占一行。行内元素上 text-align 是无效的，所以必须配合这一行 */
            text-align: right;          /* 【72】文字靠右 → "阅读全文"落到卡片右下角 */
        }                               /* 【73】链接规则结束 */

        .card a:hover {
            /* 【第75行】伪类 :hover：鼠标悬停时的状态，给用户"这个能点"的反馈。 */
            color: #b01e1e;             /* 【76】颜色加深为暗红 */
            text-decoration: underline; /* 【77】悬停时恢复下划线，进一步强化可点击感 */
        }                               /* 【78】悬停规则结束 */

        /* 【第79行】样式表结束（结束标签在下一行） */
    </style>
</head>
<!-- ↑ 【第80行】头部结束 -->

<body>
<!-- ↑ 【第81行】可见内容开始。head 里的东西不显示，从这里开始才真正画到页面上。 -->

    <div class="card">
    <!-- ↑ 【第82行】卡片容器。class="card" 让上面 .card 那一整套样式生效。
         div 是"无语义的分区标签"，只用来分组和布局，本身没有任何默认外观。 -->

        <img src="https://picsum.photos/300/200" alt="新闻图片">
        <!-- ↑ 【第83行】新闻配图。
             src = 图片地址：这里用 picsum.photos 随机图服务充当占位图，300/200 是它返回图的宽高；
             alt = 替代文本：图片加载失败时显示这行字，屏幕阅读器也会读它 → 无障碍必备。
             注意：宽度不写在标签上加 width 属性，而是交给 CSS 的 .card img 控制（结构与样式分离）。 -->

        <h3>人工智能改变未来生活</h3>
        <!-- ↑ 【第84行】标题文字。左边那条红色竖条不在 HTML 里，
             而是由 CSS 的 h3::before 伪元素画出来的。 -->

        <p>人工智能正在深入改变人们的日常生活，从智能语音助手到自动驾驶，技术让未来生活更加便捷、高效。</p>
        <!-- ↑ 【第85行】新闻摘要正文。首行缩进、灰色、1.6 倍行高，
             以及它下面那条金黄色分隔线，全部由 CSS 决定，HTML 里只管写文字。 -->

        <a href="https://www.163.com" target="_blank">阅读全文</a>
        <!-- ↑ 【第86行】跳转链接：
             href="https://www.163.com" → 点击后去网易首页（示例地址）；
             target="_blank"            → 在新标签页打开，不覆盖当前页面；
             文字在 CSS 里被设为块级 + 右对齐，所以它独占一行并靠右显示。 -->

    </div>
    <!-- ↑ 【第87行】卡片容器结束 -->

</body>
<!-- ↑ 【第88行】页面主体结束 -->

</html>
<!-- ↑ 【第89行】文档结束。按惯例，这个结束标签之后不再写任何内容
     （原文件末尾的第 90、91 行是两个空行）。 -->
